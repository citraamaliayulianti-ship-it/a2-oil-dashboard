schema_version: 2
dashboard:
  title: How exposed is the oil market to chokepoint disruptions?
  subject: oil_market
  question: Which maritime chokepoints carry the most tanker trade, and how did the Red Sea attacks (from
    November 2023) and the closure of the Strait of Hormuz (from 28 February 2026) show up in tanker transits,
    the global supply-demand balance and prices?
  audience: Energy security analysts in government agencies, international organisations and energy companies
    who monitor oil supply risk
  entrypoint: app.py
  pages:
  - home.py
  - sections/1_exposure.py
  - sections/2_disruptions.py
  - sections/3_balance.py
  - sections/4_conclusion.py
  - sections/5_data.py
  sample_environment_variable: DASHBOARD_SAMPLE_MODE
sources:
- id: eia_spot
  publisher: U.S. Energy Information Administration (EIA)
  title: Spot Prices for Crude Oil and Petroleum Products, daily (PET_PRI_SPT_S1_D)
  url: https://www.eia.gov/dnav/pet/xls/PET_PRI_SPT_S1_D.xls
  licence: U.S. government work, public domain; EIA asks users to cite "Source - U.S. Energy Information
    Administration"
  retrieved: '2026-10-15'
  cadence: Weekly release (Wednesdays) of daily prices
  status: snapshot
  notes: Release of 7 October 2026, daily data to 6 October 2026 (page https://www.eia.gov/dnav/pet/pet_pri_spt_s1_d.htm).
    Series used - RBRTE (Europe Brent spot FOB), RWTC (Cushing, OK WTI spot FOB), EER_EPMRU_PF4_RGC_DPG
    (U.S. Gulf Coast conventional gasoline regular), EER_EPD2DXL0_PF4_RGC_DPG (U.S. Gulf Coast ultra-low
    sulfur No. 2 diesel), EER_EPJK_PF4_RGC_DPG (U.S. Gulf Coast kerosene-type jet fuel). Saved as
    data/raw/eia/PET_PRI_SPT_S1_D.xls (not submitted; python -m src.data --acquire downloads it).
- id: eia_stocks
  publisher: U.S. Energy Information Administration (EIA)
  title: Weekly U.S. Stocks of Crude Oil and Petroleum Products (PET_STOC_WSTK_DCU_NUS_W)
  url: https://www.eia.gov/dnav/pet/xls/PET_STOC_WSTK_DCU_NUS_W.xls
  licence: U.S. government work, public domain; cite EIA
  retrieved: '2026-10-15'
  cadence: Weekly (Weekly Petroleum Status Report, usually Wednesdays)
  status: snapshot
  notes: Release of 7 October 2026, weeks ending to 2 October 2026. Series used - WCESTUS1 (commercial crude
    excluding SPR), WCSSTUS1 (SPR crude), WGTSTUS1 (total gasoline), WDISTUS1 (distillate fuel oil), all in
    thousand barrels and converted to million barrels.
- id: eia_cushing
  publisher: U.S. Energy Information Administration (EIA)
  title: Weekly Cushing, OK Ending Stocks excluding SPR of Crude Oil (W_EPC0_SAX_YCUOK_MBBL)
  url: https://www.eia.gov/dnav/pet/hist_xls/W_EPC0_SAX_YCUOK_MBBLw.xls
  licence: U.S. government work, public domain; cite EIA
  retrieved: '2026-10-15'
  cadence: Weekly
  status: snapshot
  notes: Release of 7 October 2026, weeks ending to 2 October 2026; thousand barrels converted to million barrels.
- id: eia_steo
  publisher: U.S. Energy Information Administration (EIA)
  title: Short-Term Energy Outlook, October 2026, monthly data tables (STEO_m.xlsx)
  url: https://www.eia.gov/outlooks/steo/xls/STEO_m.xlsx
  licence: U.S. government work, public domain; cite EIA
  retrieved: '2026-10-15'
  cadence: Monthly (next edition 10 November 2026); the file at this URL is replaced by each new edition
  status: snapshot
  notes: October 2026 edition (modelling completed 1 October 2026, published 6 October 2026). Rows used from
    tables 2 (prices), 3a (world production, consumption, inventory net withdrawals, OECD inventories), 3b and
    3c (production by country). Months to September 2026 are EIA historical estimates; October 2026 to December
    2027 are forecasts.
- id: portwatch_daily
  publisher: International Monetary Fund (IMF PortWatch)
  title: 'Daily Chokepoints Data: daily transit calls and estimated trade volumes for 28 chokepoints'
  url: https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/Daily_Chokepoints_Data/FeatureServer/0
  licence: IMF terms of use (https://www.imf.org/external/terms.htm) - free reuse with attribution "Source - International
    Monetary Fund" and a statement of any changes; PortWatch asks users to cite "Sources - UN Global Platform; IMF
    PortWatch (portwatch.imf.org)"
  retrieved: '2026-10-15'
  cadence: Updated weekly with daily values
  status: snapshot
  notes: 79,548 rows (28 chokepoints, 1 January 2019 to 11 October 2026) downloaded as 80 JSON pages of 1,000
    rows each through the ArcGIS query endpoint, saved as data/raw/portwatch/daily/ (not submitted). Built from
    AIS ship-tracking signals on the UN Global Platform. Changes made - daily rows kept for ten chokepoints,
    monthly and yearly means, 7-day means, shares and comparisons with baselines.
- id: portwatch_list
  publisher: International Monetary Fund (IMF PortWatch)
  title: PortWatch Chokepoints Database (chokepoint names and coordinates)
  url: https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/PortWatch_chokepoints_database/FeatureServer/0
  licence: IMF terms of use (https://www.imf.org/external/terms.htm), as above
  retrieved: '2026-10-15'
  cadence: Occasional
  status: snapshot
  notes: Latitude and longitude of each chokepoint, joined to the monthly table for the map.
- id: eia_steo_reports
  publisher: U.S. Energy Information Administration (EIA)
  title: Short-Term Energy Outlook reports, April, August and October 2026 editions
  url: https://www.eia.gov/outlooks/steo/archives/
  licence: U.S. government work, public domain; cite EIA
  retrieved: '2026-10-15'
  cadence: Monthly
  status: archive
  notes: Contextual source for event dates and statements quoted in the text - start of military action and
    closure of the Strait of Hormuz on 28 February 2026 (April 2026 edition); June 2026 memorandum of
    understanding, strikes on vessels resuming on 7 July 2026, Hormuz flows of 4.9 million b/d in 2Q26 against
    21.6 in 4Q25 (August 2026 edition); forecast assumptions (October 2026 edition, steo_full.pdf).
- id: eia_red_sea
  publisher: U.S. Energy Information Administration (EIA)
  title: 'Today in Energy: Fewer tankers transit the Red Sea in 2024 (11 October 2024)'
  url: https://www.eia.gov/todayinenergy/detail.php?id=63446
  licence: U.S. government work, public domain; cite EIA
  retrieved: '2026-10-15'
  cadence: One-off article
  status: archive
  notes: Contextual source - attacks on commercial ships in the Red Sea began in November 2023; Bab el-Mandeb
    oil flows 8.7 million b/d in 2023 and 4.0 in January-August 2024; Cape of Good Hope 6.0 and 9.2 (Vortexa
    data).
- id: eia_hormuz
  publisher: U.S. Energy Information Administration (EIA)
  title: 'Today in Energy: Amid regional conflict, the Strait of Hormuz remains critical oil chokepoint (16 June
    2025)'
  url: https://www.eia.gov/todayinenergy/detail.php?id=65504
  licence: U.S. government work, public domain; cite EIA
  retrieved: '2026-10-15'
  cadence: One-off article
  status: archive
  notes: Contextual source - oil flows through the strait averaged 20 million b/d in 2024 (about one-fifth of
    world petroleum liquids consumption); about 2.6 million b/d of Saudi and UAE pipeline capacity could bypass it.
- id: natural_earth
  publisher: Natural Earth
  title: Admin 0 – Countries, 1:110m (via world-atlas 2.0.2)
  url: https://www.naturalearthdata.com/downloads/110m-cultural-vectors/
  licence: Public domain (Natural Earth); world-atlas packaging under the ISC licence
  retrieved: '2026-10-13'
  cadence: Occasional releases
  status: snapshot
  notes: Contextual source for the outline map on page 1 only. Saved as data/geo/countries-110m-iso3.json.
datasets:
- id: chokepoint_day
  source_ids:
  - portwatch_daily
  sample: data/sample.csv
  processed_output: data/processed.csv
  format: csv
  date_column: date
  primary_key:
  - date
  - portid
  minimum_rows: 10000
  latest_observation: '2026-10-11'
  columns:
    date:
      type: date
      role: time
      nullable: false
      date_minimum: '2019-01-01'
      date_maximum: '2026-10-11'
    year:
      type: integer
      role: time
      nullable: false
      minimum: 2019
      maximum: 2026
    portid:
      type: string
      role: identifier
      nullable: false
      allowed_values: [chokepoint5, chokepoint6, chokepoint14, chokepoint9, chokepoint8, chokepoint4, chokepoint1,
        chokepoint11, chokepoint7, chokepoint12]
    chokepoint:
      type: string
      role: geography
      nullable: false
      allowed_values: [Malacca Strait, Strait of Hormuz, Luzon Strait, Dover Strait, Gibraltar Strait, Bab el-Mandeb
          Strait, Suez Canal, Taiwan Strait, Cape of Good Hope, Korea Strait]
    n_tanker:
      type: integer
      role: measure
      nullable: false
      unit: tanker transit calls per day
      minimum: 0
      maximum: 1000
    tanker_volume_t:
      type: integer
      role: measure
      nullable: false
      unit: metric tons per day (estimated cargo carried by tankers)
      minimum: 0
      maximum: 20000000
    n_total:
      type: integer
      role: measure
      nullable: false
      unit: vessel transit calls per day (all vessel types)
      minimum: 0
      maximum: 2000
    total_volume_t:
      type: integer
      role: measure
      nullable: false
      unit: metric tons per day (estimated cargo carried by all vessel types)
      minimum: 0
      maximum: 60000000
