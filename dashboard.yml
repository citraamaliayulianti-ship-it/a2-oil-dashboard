  download_declared: true
  download_label: Download filtered data (CSV)
  date_label: Latest observation
topic_integrity:
  physical_units: Prices in US dollars per barrel (crude oil, spreads) or US dollars per gallon (refined products;
    1 barrel = 42 U.S. gallons). Stocks in million barrels (EIA publishes thousand barrels; divided by 1,000).
    Supply, consumption and stock changes in million barrels per day. PortWatch traffic in transit calls per day
    and in metric tons per day of estimated cargo; tanker tonnage covers every tanker type (crude, products,
    chemicals and gas) and is never converted to barrels.
  frequency: Daily spot prices (trading days, so weekends and holidays are absent) and daily PortWatch transits
    (calendar days, UTC); weekly U.S. stocks (weeks ending Friday); monthly STEO estimates and forecasts. Tanker
    transits are shown as trailing 7-day means; the monitor compares values at their own frequency and shows each
    indicator's own latest date.
  observation_status: EIA spot prices and weekly stocks are reported observations (recent weekly values can be
    revised). PortWatch counts and volumes are model estimates from AIS ship-tracking signals - ships with
    transponders switched off are missed and cargo is estimated from draught. STEO months up to September 2026
    are EIA historical estimates subject to revision; later months are forecasts and are kept in a separate
    dataset (steo_forecast) and drawn dashed or pale.
  publication_vintage: EIA spot price, weekly stocks and Cushing workbooks released 7 October 2026; Short-Term
    Energy Outlook October 2026 edition (modelling completed 1 October, published 6 October 2026); PortWatch
    Daily Chokepoints Data retrieved 15 October 2026 with data to 11 October 2026.
  grade_or_contract: Brent = Europe Brent spot price FOB (EIA series RBRTE); WTI = Cushing, OK WTI spot price FOB
    (RWTC); gasoline = U.S. Gulf Coast conventional gasoline regular spot FOB; diesel = U.S. Gulf Coast ultra-low
    sulfur No. 2 diesel spot; jet fuel = U.S. Gulf Coast kerosene-type jet fuel spot FOB. Spot prices, not futures
    (EIA stopped publishing NYMEX futures prices after 5 April 2024). STEO prices are monthly averages of the same
    Brent and WTI spot series.
  location: Brent is a North Sea (Europe) price, WTI is priced at Cushing, Oklahoma, and the product prices are for
    the U.S. Gulf Coast. U.S. stocks are national totals except Cushing. Chokepoints are the 28 PortWatch transit
    boundaries; coordinates from the PortWatch chokepoints database. The seven Gulf producers are those whose sea
    exports must pass the Strait of Hormuz unless piped elsewhere (Saudi Arabia, Iraq, United Arab Emirates,
    Kuwait, Iran, Qatar, Bahrain).
  forecast_source: EIA Short-Term Energy Outlook, October 2026 edition (Short-Term Integrated Forecasting System).
    EIA assumes oil flows from the Middle East remain constrained through 4Q26. No other forecasts are used, and
    the dashboard makes no forecasts of its own.
  forecast_horizon: October 2026 to December 2027, monthly. EIA publishes no country forecast for Saudi Arabia,
    Iraq, Kuwait or Iran, so their forecast rows are absent rather than filled.
  event_dates: Event lines on charts use dates reported by EIA - November 2023 (Red Sea attacks begin), 28
    February 2026 (military action begins; Hormuz effectively closed) and 7 July 2026 (strikes on vessels
    resume). They are context only; the dashboard does not estimate the effect of any event.
