views:
- id: market_monitor
  dataset_id: market_day
  page: home.py
  title: 'Oil market monitor: prices, spreads, U.S. stocks and chokepoint transits'
  unit: as listed in each row
  source_ids:
  - eia_spot
  - eia_stocks
  - eia_cushing
  - portwatch_daily
  - eia_steo_reports
  - eia_red_sea
  controls:
  - key: monitor_groups
    type: multiselect
    label: Indicator groups
    default_value:
    - Crude prices
    - Product prices
    - Spreads
    - U.S. inventories
    - Chokepoint transits
    test_value:
    - Crude prices
    - Spreads
    empty_test_value: []
    empty_expected_text: No indicators match the selected groups.
    filter:
      column: group
      operator: isin
  - key: monitor_asof
    type: selectbox
    label: Monitor date
    default_value: Latest
    test_value: 27 Feb 2026 (day before the Hormuz closure)
  - key: monitor_window
    type: selectbox
    label: Change over
    default_value: 1 month
    test_value: 1 year
  - key: monitor_chart
    type: selectbox
    label: Chart indicator
    default_value: brent
    test_value: hormuz
  outputs:
  - metric
  - table
  - chart
  - download
- id: chokepoint_exposure
  dataset_id: chokepoint_month
  page: sections/1_exposure.py
  title: Which chokepoints carry the most tanker trade?
  unit: million metric tons per day
  source_ids:
  - portwatch_daily
  - portwatch_list
  - eia_hormuz
  - eia_red_sea
  - natural_earth
  controls:
  - key: exposure_year
    type: selectbox
    label: Year
    default_value: 2025
    test_value: 2026
    filter:
      column: year
      operator: equals
  - key: exposure_measure
    type: radio
    label: Measure
    default_value: Tanker trade volume
    test_value: Tanker transit calls
  outputs:
  - metric
  - chart
  - table
  - download
- id: chokepoint_disruption
  dataset_id: chokepoint_day
  page: sections/2_disruptions.py
  title: How did the Red Sea attacks and the Hormuz closure show up in tanker transits?
  unit: tanker transit calls per day
  source_ids:
  - portwatch_daily
  - eia_steo_reports
  - eia_red_sea
  controls:
  - key: disruption_chokepoints
    type: multiselect
    label: Chokepoints
    default_value:
    - Strait of Hormuz
    - Bab el-Mandeb Strait
    - Suez Canal
    - Cape of Good Hope
    test_value:
    - Strait of Hormuz
    - Malacca Strait
    empty_test_value: []
    empty_expected_text: No chokepoints match the selected filters.
    filter:
      column: chokepoint
      operator: isin
  - key: disruption_period
    type: slider
    label: Period
    default_value:
    - '2023-01-01'
    - '2026-10-11'
    test_value:
    - '2025-06-01'
    - '2026-10-11'
    filter:
      column: date
      operator: range
  - key: disruption_measure
    type: radio
    label: Measure
    default_value: Tanker transit calls
    test_value: Tanker trade volume (metric tons)
  - key: disruption_baseline
    type: selectbox
    label: Baseline period
    default_value: Jan–Oct 2023 (before the Red Sea attacks)
    test_value: 12 months before the Hormuz closure
  outputs:
  - metric
  - chart
  - table
  - download
- id: balance_prices
  dataset_id: steo_history
  page: sections/3_balance.py
  title: How did the global supply-demand balance, inventories and prices respond?
  unit: million barrels per day
  source_ids:
  - eia_steo
  - eia_steo_reports
  controls:
  - key: balance_period
    type: slider
    label: Period
    default_value:
    - 2022
    - 2026
    test_value:
    - 2025
    - 2026
    filter:
      column: year
      operator: range
  - key: balance_groups
    type: multiselect
    label: Series groups
    default_value:
    - World balance
    - Prices
    - Gulf producers
    test_value:
    - World balance
    empty_test_value: []
